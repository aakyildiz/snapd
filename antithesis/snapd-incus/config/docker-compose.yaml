services:
  snapd1:
    container_name: snapd1
    hostname: snapd1
    platform: linux/amd64
    image: snapd-incus-host:latest
    privileged: true
    cgroup: private
    # Incus/LXC need pivot_root, which Antithesis' default seccomp profile
    # blocks even for privileged containers.
    security_opt: ["seccomp=unconfined"]
  store:
    container_name: store
    hostname: store
    platform: linux/amd64
    image: snapd-incus-store:latest
    volumes: [storedata:/srv/store]
  driver:
    container_name: driver
    hostname: driver
    platform: linux/amd64
    image: snapd-incus-driver:latest
    environment:
      HOSTS: snapd1
      STORE_DIR: /srv/store
      STORE_URL: http://store:11028
    volumes: [storedata:/srv/store]
    depends_on: [snapd1, store]
volumes:
  storedata:
