[Service]
Environment=SNAP_REEXEC=0
Environment=SNAPD_DEBUG=1
StandardOutput=append:/var/log/antithesis/snapd.log
StandardError=append:/var/log/antithesis/snapd.log
# The fake store (container "store"), reached through an Incus proxy device
# on the container's loopback; the container has no network of its own.
Environment=SNAPPY_FORCE_API_URL=http://127.0.0.1:11028/
Environment=SNAPPY_STORE_NO_CDN=1
